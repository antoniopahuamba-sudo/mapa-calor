<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#233f91"><title>Mapa de calor relacional · Taller docente</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;color:#17233b;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.42;cursor:not-allowed}.wrap{max-width:960px;margin:auto;padding:20px 14px 48px}.hero{background:linear-gradient(125deg,#233e8f,#355fc1);color:white;border-radius:22px;padding:27px 24px;box-shadow:0 12px 32px #24458d20}.hero small{letter-spacing:.1em;font-weight:700;opacity:.86}.hero h1{margin:10px 0 8px;font-size:clamp(26px,5vw,39px)}.hero p{margin:0;line-height:1.5;color:#e9efff}.nav{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.nav button,.btn{border:0;border-radius:12px;padding:12px 17px;font-weight:750;background:#233f91;color:white}.nav button{background:white;color:#31446b;border:1px solid #dce3f0}.nav button.active{background:#233f91;color:white;border-color:#233f91}.panel{background:white;border:1px solid #e2e8f3;border-radius:20px;padding:clamp(18px,4vw,30px);box-shadow:0 8px 28px #203f8210;margin:14px 0}.panel h2{margin:0 0 10px;font-size:clamp(21px,4vw,27px)}.muted{color:#5b6981;line-height:1.55}.field{display:block;margin:15px 0 6px;font-weight:700}.input,.area{width:100%;padding:13px;border:1px solid #cdd8ea;border-radius:11px;background:white;color:#17233b}.area{min-height:95px;resize:vertical}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.space{justify-content:space-between}.secondary{background:white;color:#233f91;border:1px solid #b7c7e6}.light{background:#edf2fc;color:#233f91}.progress{height:8px;background:#e7edf8;border-radius:20px;overflow:hidden;margin:12px 0 20px}.progress>div{height:100%;background:#315cc0;transition:width .2s}.question{text-align:center;padding:12px 0 18px}.question .symbol{font-size:35px}.question h2{margin:10px 0}.choice{display:flex;align-items:center;gap:14px;width:100%;padding:17px;margin:10px 0;border:2px solid transparent;border-radius:14px;text-align:left}.choice .dot{height:20px;width:20px;border-radius:50%;flex-shrink:0}.choice strong{display:block;font-size:17px}.choice small{display:block;margin-top:3px;color:#465268}.choice.green{background:#eaf8ef}.choice.yellow{background:#fff5dc}.choice.red{background:#feebee}.choice.green .dot{background:#24824c}.choice.yellow .dot{background:#bb810d}.choice.red .dot{background:#c5414c}.choice.selected{border-color:#233f91;box-shadow:0 0 0 2px #233f9120}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:510px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e5eaf3}th{font-size:13px;color:#53627b}.pill{border-radius:100px;padding:5px 11px;display:inline-block;font-weight:750;font-size:12px}.pill.green{background:#dff3e6;color:#146537}.pill.yellow{background:#fff0c8;color:#835606}.pill.red{background:#fbe0e4;color:#a22535}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:17px 0}.stat{border-radius:14px;padding:15px;text-align:center}.stat b{font-size:30px;display:block}.stat.green{background:#eaf8ef}.stat.yellow{background:#fff5dc}.stat.red{background:#feebee}.note{padding:13px 15px;background:#f0f5ff;border-left:4px solid #3c65bc;border-radius:8px;color:#354764;line-height:1.5}.bar{display:flex;height:21px;border-radius:7px;overflow:hidden;background:#eef1f7;min-width:130px}.bar span{display:block;height:100%}.bar .g{background:#32985c}.bar .y{background:#e2ad35}.bar .r{background:#d65a63}.hide{display:none!important}.foot{font-size:12px;color:#65718a;margin:25px 4px}.empty{padding:24px;text-align:center;color:#63718a;background:#f7f9fd;border-radius:12px}.tag{font-size:12px;color:#53647f;background:#eef2fb;padding:5px 9px;border-radius:20px}.danger{color:#a32638}.printonly{display:none}@media(max-width:600px){.wrap{padding:10px 10px 30px}.hero{padding:23px 19px}.panel{padding:18px}.btn{flex:1}.nav button{flex:1}.stats{gap:5px}.stat{padding:11px 5px}.stat b{font-size:24px}}@media print{body{background:white}.nav,.noprint,.btn,.hero p{display:none!important}.wrap{max-width:100%;padding:0}.hero{color:#233f91;background:white;box-shadow:none;padding:0}.panel{box-shadow:none;break-inside:avoid}.printonly{display:block}}
</style></head><body><div class="wrap"><header class="hero"><small>FORMAR EL CARÁCTER AL ESTILO JALISCO · MÓDULO 1</small><h1>Mapa de calor relacional</h1><p>Un diagnóstico para mirar y fortalecer los vínculos de nuestra escuela.</p></header><nav class="nav noprint"><button id="navParticipant" class="active" onclick="showView('participant')">📱 Participante</button><button id="navFacilitator" onclick="showView('facilitator')">📊 Facilitador</button></nav><main id="participant"></main><main id="facilitator" class="hide"></main><footer class="foot">Actividad digital basada en «Mapa de calor relacional» (Re-Ht-02). Los resultados son percepciones para la reflexión, no evaluaciones individuales.</footer></div><script>
'use strict';const V=['Directivo ↔ docentes','Docentes ↔ docentes','Docentes ↔ alumnos','Alumnos ↔ alumnos','Escuela ↔ familias','Directivo ↔ personal de apoyo','Docentes ↔ personal de apoyo','Escuela ↔ supervisión / zona'];const C={Sano:{cls:'green',desc:'Relación positiva y de colaboración.'},Frágil:{cls:'yellow',desc:'Relación que necesita fortalecerse.'},Dañado:{cls:'red',desc:'Relación con dificultades importantes.'}};const Q=['¿Cuál de estos vínculos nunca había mirado hasta hoy?','¿Cuál sostiene a los demás?','¿Cuál, si mejorara, cambiaría más cosas?'];const KEY='mapa-calor-relacional-v1';let state={step:0,alias:'',answers:Array(8).fill(null),reflections:['','',''],priority:'',commitment:'',submitted:false};let group=[];let active='participant';try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Array.isArray(old.answers)&&old.answers.length===8)state={...state,...old}}catch(e){}function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showView(v){active=v;document.getElementById('participant').classList.toggle('hide',v!=='participant');document.getElementById('facilitator').classList.toggle('hide',v!=='facilitator');document.getElementById('navParticipant').classList.toggle('active',v==='participant');document.getElementById('navFacilitator').classList.toggle('active',v==='facilitator');if(v==='facilitator')renderFacilitator();else render();window.scrollTo({top:0,behavior:'smooth'})}function setStep(n){state.step=n;persist();render();window.scrollTo({top:130,behavior:'smooth'})}function setAlias(v){state.alias=v;persist()}function choose(v){state.answers[state.step-1]=v;persist();render()}function setReflection(i,v){state.reflections[i]=v;persist()}function setPriority(v){state.priority=v;persist()}function setCommitment(v){state.commitment=v;persist()}function stats(arr){return ['Sano','Frágil','Dañado'].map(v=>arr.filter(a=>a===v).length)}function statHtml(arr){const s=stats(arr);return `<div class="stats">${['Sano','Frágil','Dañado'].map((v,i)=>`<div class="stat ${C[v].cls}"><b>${s[i]}</b>${v}</div>`).join('')}</div>`}function personalTable(){return `<div class="tablewrap"><table><thead><tr><th>Vínculo</th><th>Estado</th></tr></thead><tbody>${V.map((v,i)=>`<tr><td>${esc(v)}</td><td><span class="pill ${C[state.answers[i]]?.cls||''}">${esc(state.answers[i]||'Sin responder')}</span></td></tr>`).join('')}</tbody></table></div>`}function render(){const el=document.getElementById('participant');let h='';if(state.step===0){h=`<section class="panel"><span class="tag">Actividad individual · 10 a 15 minutos</span><h2 style="margin-top:15px">¿Cómo están las relaciones en tu escuela?</h2><p class="muted">Valora ocho vínculos de tu escuela con tres opciones: sano, frágil o dañado. Después podrás revisar tu mapa y responder tres preguntas de reflexión.</p><div class="note">Responde desde tu experiencia. No escribas nombres de estudiantes ni detalles que permitan identificar a otras personas.</div><label class="field" for="alias">Nombre o alias (opcional)</label><input class="input" id="alias" maxlength="70" value="${esc(state.alias)}" oninput="setAlias(this.value)" placeholder="Ej. Docente 01"><div class="row" style="margin-top:20px"><button class="btn" onclick="setStep(1)">${state.answers.some(Boolean)?'Continuar diagnóstico':'Comenzar diagnóstico'} →</button></div></section>`}else if(state.step>=1&&state.step<=8){let i=state.step-1;h=`<section class="panel"><div class="row space"><span class="tag">Vínculo ${state.step} de 8</span><strong>${Math.round(state.step/8*100)}%</strong></div><div class="progress"><div style="width:${state.step/8*100}%"></div></div><div class="question"><div class="symbol">🤝</div><h2>${esc(V[i])}</h2><p class="muted">¿Cómo consideras que se encuentra actualmente este vínculo?</p></div>${Object.keys(C).map(v=>`<button class="choice ${C[v].cls} ${state.answers[i]===v?'selected':''}" onclick="choose('${v}')" aria-pressed="${state.answers[i]===v}"><span class="dot"></span><span><strong>${v}</strong><small>${C[v].desc}</small></span><span style="margin-left:auto">${state.answers[i]===v?'✓':'○'}</span></button>`).join('')}<div class="row space" style="margin-top:24px"><button class="btn secondary" onclick="setStep(${state.step-1})">← Anterior</button><button class="btn" ${!state.answers[i]?'disabled':''} onclick="setStep(${state.step+1})">${state.step===8?'Ver mi mapa':'Siguiente'} →</button></div></section>`}else if(state.step===9){h=`<section class="panel"><h2>Tu mapa de calor personal</h2><p class="muted">Revisa tus respuestas antes de continuar. Puedes volver para cambiar cualquier valoración.</p>${statHtml(state.answers)}${personalTable()}<div class="row space noprint" style="margin-top:22px"><button class="btn secondary" onclick="setStep(8)">← Revisar</button><button class="btn" onclick="setStep(10)">Responder reflexión →</button></div></section>`}else if(state.step===10){h=`<section class="panel"><span class="tag">Reflexión individual</span><h2 style="margin-top:14px">Lo que nos dice nuestro mapa</h2>${Q.map((q,i)=>`<label class="field" for="q${i}">${i+1}. ${q}</label><textarea class="area" id="q${i}" maxlength="1500" oninput="setReflection(${i},this.value)" placeholder="Escribe tu reflexión...">${esc(state.reflections[i])}</textarea>`).join('')}<div class="row space" style="margin-top:22px"><button class="btn secondary" onclick="setStep(9)">← Mi mapa</button><button class="btn" onclick="setStep(11)">Continuar →</button></div></section>`}else if(state.step===11){h=`<section class="panel"><span class="tag">Del diagnóstico a la acción</span><h2 style="margin-top:14px">Mi compromiso de mejora</h2><p class="muted">Elige un vínculo que deseas fortalecer y una acción concreta que podrías realizar durante las próximas dos semanas.</p><label class="field" for="priority">Vínculo que deseo fortalecer</label><select class="input" id="priority" onchange="setPriority(this.value)"><option value="">Selecciona un vínculo</option>${V.map(v=>`<option value="${esc(v)}" ${state.priority===v?'selected':''}>${esc(v)}</option>`).join('')}</select><label class="field" for="commitment">Mi acción concreta</label><textarea class="area" id="commitment" maxlength="1500" oninput="setCommitment(this.value)" placeholder="Me comprometo a...">${esc(state.commitment)}</textarea><div class="row space" style="margin-top:22px"><button class="btn secondary" onclick="setStep(10)">← Reflexión</button><button class="btn" onclick="finish()">Finalizar diagnóstico →</button></div></section>`}else{h=`<section class="panel"><span class="tag">Diagnóstico completado</span><h2 style="margin-top:14px">¡Gracias por participar!</h2><p class="muted">Tu diagnóstico se conserva en este navegador. Para que el facilitador pueda integrar las respuestas, descarga tu archivo anónimo y compártelo mediante el medio acordado en el taller.</p>${statHtml(state.answers)}${personalTable()}<h3>Mis reflexiones</h3>${Q.map((q,i)=>`<p><strong>${q}</strong><br>${esc(state.reflections[i]||'Sin respuesta')}</p>`).join('')}<h3>Mi compromiso</h3><p><strong>${esc(state.priority||'Sin vínculo seleccionado')}</strong><br>${esc(state.commitment||'Sin compromiso registrado')}</p><div class="row noprint" style="margin-top:22px"><button class="btn" onclick="downloadResponse()">⬇ Descargar respuesta anónima</button><button class="btn secondary" onclick="window.print()">🖨 Guardar como PDF</button><button class="btn light" onclick="setStep(9)">Editar respuestas</button></div><p class="muted noprint" style="font-size:13px">El archivo de resultados grupales incluye únicamente los ocho estados; tus reflexiones, alias y compromiso permanecen en tu dispositivo y en tu PDF personal.</p></section>`}el.innerHTML=h}function finish(){state.submitted=true;setStep(12)}function downloadFile(name,content,type){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}function downloadResponse(){if(state.answers.some(a=>!C[a]))return alert('Completa los ocho vínculos.');const obj={format:'mapa-calor-relacional',version:1,answers:state.answers,createdAt:new Date().toISOString()};downloadFile('respuesta-mapa-calor-'+Date.now()+'.json',JSON.stringify(obj,null,2),'application/json')}function validRecord(o){return o&&o.format==='mapa-calor-relacional'&&o.version===1&&Array.isArray(o.answers)&&o.answers.length===8&&o.answers.every(a=>Object.hasOwn(C,a))}async function importFiles(input){let files=[...input.files],ok=0,fail=0;for(const f of files){try{let o=JSON.parse(await f.text());if(!validRecord(o))throw Error('Formato incorrecto');group.push({answers:o.answers});ok++}catch(e){fail++}}input.value='';renderFacilitator();alert(`Importadas: ${ok}. Archivos no válidos: ${fail}.`)}function resetGroup(){if(confirm('¿Borrar los resultados grupales importados en esta sesión?')){group=[];renderFacilitator()}}function resetPersonal(){if(confirm('¿Borrar el diagnóstico guardado en este dispositivo y comenzar de nuevo?')){state={step:0,alias:'',answers:Array(8).fill(null),reflections:['','',''],priority:'',commitment:'',submitted:false};persist();render();showView('participant')}}function renderFacilitator(){let h=`<section class="panel"><span class="tag">Vista del facilitador</span><h2 style="margin-top:14px">Mapa de calor colectivo</h2><p class="muted">Recibe los archivos JSON anónimos de los participantes y selecciónalos aquí para integrar las respuestas. Puedes seleccionar varios archivos a la vez.</p><div class="note"><strong>Funcionamiento:</strong> esta versión es local y no transmite respuestas automáticamente entre celulares. Para recopilar respuestas, pide a los docentes que compartan su archivo anónimo por el medio acordado y después impórtalos en este tablero.</div><label class="field" for="files">Importar respuestas de los docentes</label><input class="input" id="files" type="file" accept=".json,application/json" multiple onchange="importFiles(this)"><div class="row space" style="margin:18px 0"><strong>Participantes integrados: ${group.length}</strong><button class="btn secondary noprint" onclick="resetGroup()">Limpiar tablero</button></div>`;if(!group.length){h+='<div class="empty">Aún no hay respuestas importadas. El mapa colectivo aparecerá aquí.</div>'}else{h+=`<div class="tablewrap"><table><thead><tr><th>Vínculo</th><th>Sano</th><th>Frágil</th><th>Dañado</th><th>Distribución</th></tr></thead><tbody>${V.map((v,i)=>{let s=stats(group.map(g=>g.answers[i]));return `<tr><td>${esc(v)}</td><td>${s[0]} (${Math.round(s[0]/group.length*100)}%)</td><td>${s[1]} (${Math.round(s[1]/group.length*100)}%)</td><td>${s[2]} (${Math.round(s[2]/group.length*100)}%)</td><td><div class="bar" aria-label="Sano ${s[0]}, frágil ${s[1]}, dañado ${s[2]}"><span class="g" style="width:${s[0]/group.length*100}%"></span><span class="y" style="width:${s[1]/group.length*100}%"></span><span class="r" style="width:${s[2]/group.length*100}%"></span></div></td></tr>`}).join('')}</tbody></table></div><div class="row noprint" style="margin-top:22px"><button class="btn" onclick="exportCSV()">⬇ Exportar resultados CSV</button><button class="btn secondary" onclick="window.print()">🖨 Imprimir tablero / PDF</button></div>`}h+=`<p class="muted" style="font-size:13px">Los resultados importados se conservan únicamente mientras esta página permanezca abierta. Exporta el CSV antes de cerrar la pestaña. No se almacenan nombres ni reflexiones en el tablero.</p></section><section class="panel noprint"><h2>Instrucciones para el taller</h2><p class="muted">1. Comparte el archivo HTML con los maestros o publícalo en un sitio web estático. 2. Cada maestro responde en su celular y descarga su respuesta anónima. 3. Recibe los archivos JSON y selecciónalos juntos en el tablero. 4. Proyecta el mapa colectivo para conversar sobre los vínculos que necesitan atención.</p><button class="btn light" onclick="resetPersonal()">Reiniciar diagnóstico de este dispositivo</button></section>`;document.getElementById('facilitator').innerHTML=h}function exportCSV(){if(!group.length)return;let rows=[['Vínculo','Sano','Frágil','Dañado','Total'],...V.map((v,i)=>[v,...stats(group.map(g=>g.answers[i])),group.length])];let csv='\ufeff'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile('resultados-mapa-calor.csv',csv,'text/csv;charset=utf-8')}render();renderFacilitator();</script></body></html>
